<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aba Nigeria card</title>
  <style>
  

    .place-card {
      width: min(300px, 100%);
      padding: 20px;
      border: 1px solid #d2d2d2;
      background: #eee;
      text-align: center;
    }

    .details {
      margin: 20px;
     
    }

    .details p { 
        margin: 0; 
    }


    .place-card img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: cover;
      box-shadow: 0 5px 10px 5px rgba(0, 0, 0, .50);
    }

  
  </style>
</head>
<body>
  <article class="place-card" aria-labelledby="place-name">
    <h1 id="place-name">Aba Nigeria</h1>
    <div class="details">
        <p>Location : Aba, Nigeria</p>
        <p>Dedicated : 2005, August, 7</p>
        <p>Size: 11500 sq ft</p>
    </div>
    <img src="https://content.churchofjesuschrist.org/templesldsorg/bc/Temples/photo-galleries/salt-lake-city-utah/400x250/salt-lake-temple-37762.jpg" alt="A large illuminated building in Aba, Nigeria, at dusk">
  </article>
</body>
</html>
